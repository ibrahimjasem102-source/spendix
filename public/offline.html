<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F17" />
  <title>Spendix — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0B0F17;
      --card:    #111827;
      --border:  rgba(255,255,255,0.08);
      --text-1:  #F1F5F9;
      --text-2:  #94A3B8;
      --text-3:  #475569;
      --accent:  #06B6D4;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100svh; padding: 24px;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px 32px; text-align: center;
      max-width: 340px; width: 100%;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 32px; height: 32px; color: var(--accent); }
    h1 { font-size: 20px; font-weight: 800; color: var(--text-1); margin-bottom: 8px; }
    p  { font-size: 14px; color: var(--text-2); line-height: 1.6; margin-bottom: 28px; }
    button {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: var(--accent); color: #0B0F17;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: 0.85; }
    .status {
      margin-top: 16px; font-size: 11px; color: var(--text-3);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #F43F5E; animation: pulse 2s infinite;
    }
    .dot.online { background: #10B981; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 3l18 18M8.111 8.111A3.5 3.5 0 0 0 12 17a3.5 3.5 0 0 0 3.5-3.5M21 12a9 9 0 0 0-9-9 8.96 8.96 0 0 0-4.903 1.449M3.228 3.228A9 9 0 0 0 12 21" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Spendix is not available right now. Your data is safe — everything will sync automatically when you reconnect.</p>
    <button onclick="tryReload()">Try Again</button>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">No internet connection</span>
    </div>
  </div>

  <script>
    function tryReload() {
      if (navigator.onLine) window.location.href = "/dashboard";
      else document.getElementById("status-text").textContent = "Still offline — try again soon";
    }

    function updateStatus() {
      const dot  = document.getElementById("dot");
      const text = document.getElementById("status-text");
      if (navigator.onLine) {
        dot.classList.add("online");
        text.textContent = "Connection restored! Redirecting...";
        setTimeout(() => window.location.href = "/dashboard", 1200);
      } else {
        dot.classList.remove("online");
        text.textContent = "No internet connection";
      }
    }

    window.addEventListener("online",  updateStatus);
    window.addEventListener("offline", updateStatus);
    updateStatus();
  </script>
</body>
</html>
